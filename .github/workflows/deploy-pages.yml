name: Loading Business Ledger CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loading-ledger-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Ledger, Ask Rico, and offline PWA
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check ask-rico.js
          node --check sw.js
          node --check scripts/verify-static-site.mjs
      - name: Validate all static app files
        run: node scripts/verify-static-site.mjs

  deploy:
    name: Deploy GitHub Pages automatically
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build publish directory
        run: node scripts/verify-static-site.mjs --build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
